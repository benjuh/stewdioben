<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="5" fill="#0d0d1a"/>
  <!-- Row 1 -->
  <rect x="2" y="2" width="8" height="8" rx="1.5" fill="#1e1e3a"/>
  <rect x="12" y="2" width="8" height="8" rx="1.5" fill="#1e1e3a"/>
  <rect x="22" y="2" width="8" height="8" rx="1.5" fill="#1e1e3a"/>
  <!-- Row 2 -->
  <rect x="2" y="12" width="8" height="8" rx="1.5" fill="#1e1e3a"/>
  <!-- Center: helmet cell -->
  <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#0f1e40"/>
  <!-- Helmet dome (facing right) -->
  <path d="M13.5,19.5 Q13,14 16,13.5 Q19.5,13.5 19.5,16.5 L19.5,19.5 Z" fill="#1a3a8f"/>
  <!-- Facemask bars -->
  <line x1="19.5" y1="14.8" x2="21.5" y2="14.8" stroke="#60a5fa" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="19.5" y1="16.3" x2="21.5" y2="16.3" stroke="#60a5fa" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="21.5" y1="14.8" x2="21.5" y2="16.3" stroke="#60a5fa" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Ear hole -->
  <circle cx="14" cy="17.5" r="0.7" fill="#0d0d1a"/>
  <rect x="22" y="12" width="8" height="8" rx="1.5" fill="#1e1e3a"/>
  <!-- Row 3 -->
  <rect x="2" y="22" width="8" height="8" rx="1.5" fill="#1e1e3a"/>
  <rect x="12" y="22" width="8" height="8" rx="1.5" fill="#1e1e3a"/>
  <rect x="22" y="22" width="8" height="8" rx="1.5" fill="#1e1e3a"/>
</svg>

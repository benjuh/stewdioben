<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Stewordle</title>
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport"
        content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, target-densitydpi=device-dpi" />
</head>

<body>
  <header class="header">
    <div class="header-left">
      <a class="hub-back" href="/">← Hub</a>
      <div class="logo-tiles" aria-hidden="true">
        <span class="logo-tile logo-tile--correct">S</span>
        <span class="logo-tile logo-tile--correct">T</span>
        <span class="logo-tile logo-tile--correct">E</span>
        <span class="logo-tile logo-tile--correct">W</span>
        <span class="logo-tile logo-tile--absent">O</span>
        <span class="logo-tile logo-tile--absent">R</span>
        <span class="logo-tile logo-tile--absent">D</span>
        <span class="logo-tile logo-tile--absent">L</span>
        <span class="logo-tile logo-tile--present">E</span>
      </div>
      <span class="title">Stewordle</span>
      <button class="theme-toggle" id="theme-toggle">☀</button>
    </div>
    <nav class="mode-tabs" id="mode-tabs">
      <button class="mode-tab active" data-mode="classic"><span class="tab-label-long">Classic</span><span class="tab-label-short">1</span></button>
      <button class="mode-tab" data-mode="quad"><span class="tab-label-long">Quad</span><span class="tab-label-short">4</span></button>
      <button class="mode-tab" data-mode="octo"><span class="tab-label-long">Octo</span><span class="tab-label-short">8</span></button>
      <button class="mode-tab" data-mode="16">16</button>
    </nav>
  </header>

  <div class="game-container" id="game-container">
    <div class="board-badges" id="board-badges"></div>
    <div class="board-grid" id="board-container"></div>
  </div>

  <div class="keyboard-container">
    <div class="keyboard" id="keyboard"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
